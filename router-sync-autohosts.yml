- name: Sync auto-hosts inventory from OpenWrt
  hosts: routers
  gather_facts: false

  tasks:
    - name: Validate required vars
      ansible.builtin.assert:
        that:
          - semaphore_url is defined
          - semaphore_api_token is defined
          - semaphore_project_id is defined
          - target_inventory_id is defined
        fail_msg: "Missing vars in Variable Group (semaphore_url, semaphore_api_token, semaphore_project_id, target_inventory_id)"

    - name: Build host lines from OpenWrt leases
      ansible.builtin.raw: |
        if [ -f /tmp/dhcp.leases ]; then
          awk '{
            ip=$3; host=$4;
            if (ip !~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) next;
            if (host == "" || host == "*") host="host";
            gsub(/[^A-Za-z0-9_-]/, "_", host);
            ip_id=ip; gsub(/\./, "_", ip_id);
            printf "%s_%s ansible_host=%s\n", host, ip_id, ip
          }' /tmp/dhcp.leases | sort -u
        fi
      register: leases
      changed_when: false

    - name: Compose inventory text
      ansible.builtin.set_fact:
        new_inventory_text: |
          [auto_hosts]
          {{ leases.stdout | trim }}

    - name: Read current target inventory object
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
        validate_certs: false
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: inv

    - name: Update target inventory in Semaphore
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
          Content-Type: "application/json"
        validate_certs: false
        body_format: json
        status_code: 204
        body:
          id: "{{ inv.json.id }}"
          name: "{{ inv.json.name }}"
          project_id: "{{ inv.json.project_id }}"
          inventory: "{{ new_inventory_text }}"
          ssh_key_id: "{{ inv.json.ssh_key_id }}"
          become_key_id: "{{ inv.json.become_key_id }}"
          repository_id: "{{ inv.json.repository_id }}"
          type: "{{ inv.json.type }}"
      delegate_to: localhost

    - name: Done
      ansible.builtin.debug:
        msg: "Inventory {{ inv.json.name }} updated"
