---
- name: Probe hosts and mark flash candidates
  hosts: "auto_hosts:serverbox"
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Check marker file in HOME
      ansible.builtin.shell: test -f "$HOME/ez-flashed"
      register: marker_check
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Calculate host state
      ansible.builtin.set_fact:
        host_reachable: "{{ marker_check is defined and marker_check is reachable }}"
        host_is_serverbox: >-
          {{
            ((inventory_hostname | lower) is match('^serverbox[-_ ]*[0-9]+'))
            or
            ((inventory_hostname | lower) is match('^sb[0-9]+$'))
          }}
        needs_flash: >-
          {{
            (marker_check is defined)
            and (marker_check is reachable)
            and ((marker_check.rc | default(1)) != 0)
            and (
              ((inventory_hostname | lower) is match('^serverbox[-_ ]*[0-9]+'))
              or
              ((inventory_hostname | lower) is match('^sb[0-9]+$'))
            )
          }}

    - name: Group by reachability
      ansible.builtin.group_by:
        key: "reachable_{{ 'yes' if host_reachable else 'no' }}"

    - name: Group by serverbox pattern
      ansible.builtin.group_by:
        key: "serverbox_{{ 'yes' if host_is_serverbox else 'no' }}"

    - name: Group by flash status
      ansible.builtin.group_by:
        key: "flash_{{ 'yes' if needs_flash else 'no' }}"

- name: Build inventory text and update Semaphore inventory
  hosts: localhost
  gather_facts: false

  vars:
    semaphore_url: "{{ semaphore_url | default('https://semaphore-23525.magellan-fms.com') }}"
    semaphore_project_id: "{{ semaphore_project_id | default(1) }}"
    target_inventory_id: "{{ target_inventory_id | default(7) }}"
    target_inventory_name: "{{ target_inventory_name | default('auto-hosts') }}"

  tasks:
    - name: Validate required vars
      ansible.builtin.assert:
        that:
          - semaphore_api_token is defined
          - semaphore_api_token | length > 10
        fail_msg: "Нужен semaphore_api_token в Variable Group"

    - name: Init serverbox lines
      ansible.builtin.set_fact:
        serverbox_lines: []

    - name: Build serverbox lines from candidates
      ansible.builtin.set_fact:
        serverbox_lines: "{{ serverbox_lines + [line_out] }}"
      vars:
        ip_out: "{{ hostvars[item].ansible_host | default(item) }}"
        port_out: "{{ hostvars[item].ansible_port | default('') }}"
        id_from_serverbox: "{{ (item | lower | regex_findall('^serverbox[-_ ]*([0-9]+)') | first | default('')) }}"
        id_from_sb: "{{ (item | lower | regex_findall('^sb([0-9]+)$') | first | default('')) }}"
        sb_id: "{{ id_from_serverbox if (id_from_serverbox | length > 0) else id_from_sb }}"
        sb_name: "{{ ('sb' ~ sb_id) if (sb_id | length > 0) else item }}"
        port_part: "{{ (' ansible_port=' ~ (port_out | string)) if (port_out | string | length > 0) else '' }}"
        line_out: "{{ sb_name ~ ' ansible_host=' ~ ip_out ~ port_part }}"
      loop: "{{ groups['flash_yes'] | default([]) }}"

    - name: Compose inventory text with REAL new lines
      ansible.builtin.set_fact:
        inventory_lines: "{{ ['[serverbox]'] + serverbox_lines + [''] + ['[all:children]', 'serverbox'] }}"
        new_inventory_text: "{{ inventory_lines | join('\n') }}"

    - name: Read current target inventory object
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: GET
        headers:
          Accept: "application/json"
          Authorization: "Bearer {{ semaphore_api_token }}"
        return_content: true
        status_code: [200]
      register: inv_get

    - name: Update target inventory in Semaphore
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: PUT
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
          Authorization: "Bearer {{ semaphore_api_token }}"
        body_format: json
        body:
          name: "{{ inv_get.json.name | default(target_inventory_name) }}"
          project_id: "{{ inv_get.json.project_id | default(semaphore_project_id) }}"
          inventory: "{{ new_inventory_text }}"
          ssh_key_id: "{{ inv_get.json.ssh_key_id }}"
          become_key_id: "{{ inv_get.json.become_key_id | default(None) }}"
          type: "{{ inv_get.json.type | default('static') }}"
        return_content: true
        status_code: [200, 204]
      register: inv_put

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "Candidates count: {{ (groups['flash_yes'] | default([])) | length }}"
          - "Written lines: {{ serverbox_lines | length }}"
          - "Inventory {{ target_inventory_name }} updated"
