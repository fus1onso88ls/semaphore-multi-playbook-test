- name: Filter hosts by access, name and flashed marker
  hosts: "auto_hosts:serverbox"
  gather_facts: false
  ignore_unreachable: true

  vars:
    marker_file: "ez-flashed"

  tasks:
    - name: Check marker file in HOME
      ansible.builtin.raw: 'test -f "$HOME/{{ marker_file }}"'
      register: marker_check
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Calculate host state
      ansible.builtin.set_fact:
        host_reachable: "{{ (marker_check is defined) and (marker_check is reachable) }}"
        host_is_serverbox: "{{ ((inventory_hostname | lower) is match('^serverbox[-_ ]*[0-9]+')) or ((inventory_hostname | lower) is match('^sb[0-9]+$')) }}"
        needs_flash: >-
          {{
            (marker_check is defined) and
            (marker_check is reachable) and
            ((marker_check.rc | default(1)) != 0) and
            (
              ((inventory_hostname | lower) is match('^serverbox[-_ ]*[0-9]+')) or
              ((inventory_hostname | lower) is match('^sb[0-9]+$'))
            )
          }}

    - name: Group hosts by reachability
      ansible.builtin.group_by:
        key: "reachable_{{ 'yes' if host_reachable else 'no' }}"

    - name: Group hosts by serverbox name
      ansible.builtin.group_by:
        key: "serverbox_{{ 'yes' if host_is_serverbox else 'no' }}"

    - name: Group hosts by flash status
      ansible.builtin.group_by:
        key: "flash_{{ 'yes' if needs_flash else 'no' }}"

    - name: Clear host error flags
      ansible.builtin.meta: clear_host_errors

- name: Save filtered list back to auto-hosts inventory
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate vars from Variable Group
      ansible.builtin.assert:
        that:
          - semaphore_url is defined
          - semaphore_api_token is defined
          - semaphore_project_id is defined
          - target_inventory_id is defined
        fail_msg: "Missing vars in Variable Group"

    - name: Build list of hosts that need flash
      ansible.builtin.set_fact:
        flash_hosts: "{{ groups['flash_yes'] | default([]) }}"

    - name: Debug filter groups
      ansible.builtin.debug:
        msg:
          - "input_auto_hosts={{ groups['auto_hosts'] | default([]) }}"
          - "input_serverbox={{ groups['serverbox'] | default([]) }}"
          - "serverbox_yes={{ groups['serverbox_yes'] | default([]) }}"
          - "reachable_yes={{ groups['reachable_yes'] | default([]) }}"
          - "flash_yes={{ groups['flash_yes'] | default([]) }}"
          - "flash_no={{ groups['flash_no'] | default([]) }}"
          - "reachable_no={{ groups['reachable_no'] | default([]) }}"

    - name: No candidates - keep current inventory unchanged
      ansible.builtin.debug:
        msg: "No hosts matched filter, inventory is not overwritten."
      when: (flash_hosts | length) == 0

    - name: Stop play when no candidates
      ansible.builtin.meta: end_play
      when: (flash_hosts | length) == 0

    - name: Init filtered lines
      ansible.builtin.set_fact:
        filtered_lines: []

    - name: Build filtered host lines (ServerBoxNNN -> sbNNN)
      vars:
        sb_name: >-
          {{
            (
              (h | lower) | regex_replace('^serverbox[-_ ]*([0-9]+).*$','sb\\1')
            )
            if ((h | lower) is match('^serverbox[-_ ]*[0-9]+'))
            else
            (
              (h | lower) | regex_replace('^sb([0-9]+).*$','sb\\1')
            )
          }}
      ansible.builtin.set_fact:
        filtered_lines: >-
          {{
            filtered_lines + [
              sb_name ~
              ' ansible_host=' ~ (hostvars[h].ansible_host | default(h)) ~
              (
                (' ansible_port=' ~ (hostvars[h].ansible_port | string))
                if (hostvars[h].ansible_port is defined)
                else ''
              )
            ]
          }}
      loop: "{{ flash_hosts }}"
      loop_control:
        loop_var: h

    - name: Build new inventory text
      ansible.builtin.set_fact:
        filtered_inventory_text: >-
          {{
            (
              ['[serverbox]'] +
              (filtered_lines | default([])) +
              ['', '[all:children]', 'serverbox']
            ) | join('\n')
          }}{{ '\n' }}

    - name: Read current target inventory object
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: inv

    - name: Build update JSON body
      ansible.builtin.set_fact:
        update_body_json: >-
          {
            "id": {{ inv.json.id }},
            "name": {{ inv.json.name | to_json }},
            "project_id": {{ inv.json.project_id }},
            "type": {{ inv.json.type | to_json }},
            "ssh_key_id": {{ inv.json.ssh_key_id }},
            "inventory": {{ filtered_inventory_text | to_json }}
          }

    - name: Update inventory in Semaphore
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
          Content-Type: "application/json"
        validate_certs: false
        body_format: json
        body: "{{ update_body_json }}"
        status_code: 204

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "Total selected for flash: {{ flash_hosts | length }}"
          - "Inventory updated with [serverbox] and [all:children]"
