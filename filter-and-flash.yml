---
- name: Filter hosts by access and flashed marker
  hosts: auto_hosts
  gather_facts: false
  ignore_unreachable: true

  vars:
    marker_file: "ez-flashed"

  tasks:
    - name: Check marker file in HOME
      ansible.builtin.raw: 'test -f "$HOME/{{ marker_file }}"'
      register: marker_check
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Calculate host state
      ansible.builtin.set_fact:
        host_reachable: "{{ (marker_check is defined) and (marker_check is reachable) }}"
        needs_flash: "{{ (marker_check is defined) and (marker_check is reachable) and ((marker_check.rc | default(1)) != 0) }}"

    - name: Group hosts by reachability
      ansible.builtin.group_by:
        key: "reachable_{{ 'yes' if host_reachable else 'no' }}"

    - name: Group hosts by flash status
      ansible.builtin.group_by:
        key: "flash_{{ 'yes' if needs_flash else 'no' }}"

    - name: Clear host error flags
      ansible.builtin.meta: clear_host_errors


- name: Save filtered list back to serverbox inventory
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate vars from Variable Group
      ansible.builtin.assert:
        that:
          - semaphore_url is defined
          - semaphore_api_token is defined
          - semaphore_project_id is defined
          - target_inventory_id is defined
        fail_msg: "Missing vars in Variable Group"

    - name: Build list of hosts that need flash
      ansible.builtin.set_fact:
        flash_hosts: "{{ groups['flash_yes'] | default([]) }}"

    - name: Init serverbox lines
      ansible.builtin.set_fact:
        serverbox_lines: []

    - name: Build serverbox host lines
      ansible.builtin.set_fact:
        serverbox_lines: >-
          {{
            serverbox_lines + [
              (h | regex_replace('(?i)^serverbox', 'sb') | lower) ~
              ' ansible_host=' ~ (hostvars[h].ansible_host | default(h)) ~
              (
                (' ansible_port=' ~ (hostvars[h].ansible_port | string))
                if (hostvars[h].ansible_port is defined)
                else ''
              )
            ]
          }}
      loop: "{{ flash_hosts }}"
      loop_control:
        loop_var: h
      when: h is match('(?i)^serverbox[0-9]+$')

    - name: Build new inventory text
      ansible.builtin.set_fact:
        filtered_inventory_text: "{{ '[serverbox]\n' ~ ((serverbox_lines | default([])) | join('\n')) ~ '\n' }}"

    - name: Read current target inventory object
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: inv

    - name: Build update JSON body
      ansible.builtin.set_fact:
        update_body_json: >-
          {
            "id": {{ inv.json.id }},
            "name": {{ inv.json.name | to_json }},
            "project_id": {{ inv.json.project_id }},
            "type": {{ inv.json.type | to_json }},
            "ssh_key_id": {{ inv.json.ssh_key_id }},
            "inventory": {{ filtered_inventory_text | to_json }}
          }

    - name: Update inventory in Semaphore
      ansible.builtin.uri:
        url: "{{ semaphore_url }}/api/project/{{ semaphore_project_id }}/inventory/{{ target_inventory_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ semaphore_api_token }}"
          Content-Type: "application/json"
        validate_certs: false
        body_format: json
        body: "{{ update_body_json }}"
        status_code: 204

    - name: Show generated inventory
      ansible.builtin.debug:
        msg: "{{ filtered_inventory_text }}"

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "Total input hosts: {{ groups['auto_hosts'] | default([]) | length }}"
          - "Reachable: {{ groups['reachable_yes'] | default([]) | length }}"
          - "Need flash: {{ groups['flash_yes'] | default([]) | length }}"
          - "ServerBox saved: {{ serverbox_lines | default([]) | length }}"
          - "Already flashed: {{ groups['flash_no'] | default([]) | length }}"
          - "Unreachable/wrong creds: {{ groups['reachable_no'] | default([]) | length }}"


- name: Flash only hosts without marker
  hosts: flash_yes
  gather_facts: false
  serial: 5

  tasks:
    - name: Placeholder flash step 1
      ansible.builtin.debug:
        msg: "FLASH STEP 1 for {{ inventory_hostname }}"

    - name: Placeholder flash step 2
      ansible.builtin.debug:
        msg: "FLASH STEP 2 for {{ inventory_hostname }}"
